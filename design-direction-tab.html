<style>
/* design direction tab */
.dd-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}

.dd-intro p{margin:0;color:var(--muted);max-width:40em}
.dd-tabs{display:flex;gap:8px;flex-wrap:wrap}
.dd-tab{all:unset;box-sizing:border-box;cursor:pointer;font-family:var(--display);font-weight:700;font-size:14px;padding:8px 16px;border:2px solid var(--ink);border-radius:999px;background:#fff;display:inline-flex;align-items:center;gap:8px}

.dd-panel{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}

.dd-frame{border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:6px 6px 0 var(--ink)}

.mk-food .f-btn.alt{background:transparent;color:var(--deep);box-shadow:none}
.mk-food .f-art{position:relative;height:27em;display:flex;align-items:flex-end;justify-content:center;gap:1em}
.mk-food .f-sun{position:absolute;width:24em;height:24em;border-radius:50%;background:var(--butter);left:50%;top:48%;transform:translate(-50%,-50%)}

.mk-food .jar::before{content:"";position:absolute;left:12%;right:12%;top:-1.5em;height:1.5em;background:var(--lid,#1F4D2E);border:.18em solid var(--deep);border-radius:.4em .4em .1em .1em}

.mk-food .jar b small{display:block;font-family:'Instrument Sans',sans-serif;font-size:.55em;font-weight:600;margin-top:.3em}
.mk-food .f-art .jar.big{width:10em;height:14em}
.mk-food .f-art .jar.tilt{transform:rotate(6deg)}
.mk-food .f-art .jar.tilt2{transform:rotate(-5deg)}
.mk-food .f-sticker{position:absolute;right:0;top:1.5em;width:8.5em;height:8.5em;border-radius:50%;background:var(--beet);color:#fff;display:grid;place-items:center;text-align:center;padding:1em;font-weight:600;font-size:.9em;line-height:1.2;transform:rotate(12deg);border:.18em solid var(--deep)}
.mk-food .f-strip{background:var(--cuke);color:var(--butter);white-space:nowrap;overflow:hidden;padding:.8em 0;font-size:1.5em}

.mk-food .f-shop-h span{font-weight:600;text-decoration:underline;text-underline-offset:.2em}

.mk-prod .bottle b{position:absolute;left:12%;right:12%;top:32%;bottom:18%;background:var(--fog);border-radius:.3em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Marcellus',serif;font-weight:400;font-size:.95em;line-height:1.1;padding:.3em}
